# Build the DeepSeek Harness app shells (macOS and Windows) and attach them to
# a GitHub Release.
#
# Build runs without credentials on every pull request and master push so a
# pull request proves the apps still assemble. Publishing attaches the
# platform zips to the GitHub Release for the tag: automatically on a dsh-v*
# tag push, or on manual dispatch with publish=true (which must also run from
# a dsh-v* tag). The bundled builds embed @deepseek-ai/dsh at the exact tagged
# version, so that version must be published to npm first.
name: App Release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the built apps to a GitHub Release. Must run from a dsh-v* tag.
        required: true
        type: boolean
        default: false
      bundle_dsh:
        description: Embed @deepseek-ai/dsh into the apps (self-contained; needs the version published on npm).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The fork ships the Windows exe only. The macOS shell is skipped in this
  # fork's release so the Release does not attach an upstream-behavior macOS app
  # that would silently lack the fork's Plan/Act routing and Auto/Manual toggle.
  build-macos:
    name: Build DeepSeek Harness.app
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#dsh-v}"
          else
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/cli/package.json', 'utf8')).version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Decide bundling
        id: decide
        run: |
          RELEASE_PUSH="${{ github.event_name == 'push' && github.ref_type == 'tag' }}"
          if [[ "$RELEASE_PUSH" == "true" || "${{ inputs.publish }}" == "true" || "${{ inputs.bundle_dsh }}" == "true" ]]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (universal)
        env:
          DSH_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=(--universal)
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            ARGS+=(--bundle-dsh)
          fi
          apps/macos/build.sh "${ARGS[@]}"

      - name: Verify the bundle
        run: |
          APP="apps/macos/build/DeepSeek Harness.app"
          codesign -dv "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "arm64"
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            test -x "$APP/Contents/Resources/dsh/node_modules/.bin/dsh"
          fi
          "$APP/Contents/MacOS/DeepSeek Harness" --resolve

      - name: Run the lifecycle test
        if: ${{ steps.decide.outputs.bundle == 'true' }}
        run: apps/macos/scripts/test-lifecycle.sh

      - name: Zip the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/macos/build
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Harness.app" "DeepSeek-Harness-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macos
          path: apps/macos/build/DeepSeek-Harness-*.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build DeepSeek Harness.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#dsh-v}"
          else
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/cli/package.json', 'utf8')).version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Decide bundling
        id: decide
        shell: bash
        run: |
          RELEASE_PUSH="${{ github.event_name == 'push' && github.ref_type == 'tag' }}"
          if [[ "$RELEASE_PUSH" == "true" || "${{ inputs.publish }}" == "true" || "${{ inputs.bundle_dsh }}" == "true" ]]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        shell: bash
        env:
          DSH_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=()
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            ARGS+=(-BundleDsh)
          fi
          powershell -ExecutionPolicy Bypass -File apps/windows/build.ps1 "${ARGS[@]}"

      # The fork's features (Plan/Act dual-model routing, the Auto/Manual model
      # toggle, and the session.setAutoRouting RPC behind it) live only in this
      # fork's packages. -BundleDsh installs the UPSTREAM npm @deepseek-ai/dsh,
      # so after bundling we build the fork workspace and overlay the fork-built
      # host packages + browser bundles with rebundle.ps1. Without this the exe
      # would ship upstream behavior.
      - name: Install pnpm
        shell: bash
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version

      - name: Install workspace deps
        shell: bash
        run: pnpm install --frozen-lockfile=false

      - name: Build the fork packages (host + browser imports)
        shell: bash
        run: |
          pnpm run build:lib:host
          pnpm run build:lib:client

      - name: Overlay the fork build into the bundled dsh (rebundle)
        shell: pwsh
        run: apps/windows/rebundle.ps1

      - name: Verify the fork overlay landed
        shell: bash
        run: |
          WIRE="apps/windows/build/dsh/node_modules/@deepseek-ai/dsh-client-connection/lib/client.js"
          test -f "$WIRE"
          grep -q "session.setAutoRouting" "$WIRE"
          test -f "apps/windows/build/dsh/node_modules/@deepseek-ai/dsh-model-router/lib/index.js"

      - name: Verify the app
        shell: bash
        run: |
          EXE="apps/windows/build/DeepSeek Harness.exe"
          test -f "$EXE"
          test -f "apps/windows/build/Microsoft.Web.WebView2.Core.dll"
          test -f "apps/windows/build/Microsoft.Web.WebView2.WinForms.dll"
          test -f "apps/windows/build/WebView2Loader.dll"
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            test -f "apps/windows/build/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
            "$EXE" --resolve
          fi

      - name: Run the lifecycle test
        if: ${{ steps.decide.outputs.bundle == 'true' }}
        shell: pwsh
        run: apps/windows/scripts/test-lifecycle.ps1

      # Build the self-contained Setup.exe installer. build-installer.ps1
      # reuses the already-built + rebundled build/ folder (it never re-installs
      # upstream, so the fork overlay survives), adds a portable Node.js runtime
      # under build/runtime/node, and compiles installer.iss with Inno Setup into
      # build/DeepSeek-Harness-Setup-<version>.exe.
      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup --yes --no-progress

      - name: Build the Windows installer (Setup.exe)
        shell: pwsh
        run: apps/windows/build-installer.ps1 -NodeVersion 22.19.0

      - name: Verify the installer
        shell: bash
        run: |
          ls apps/windows/build/DeepSeek-Harness-Setup-*.exe
          test -f "apps/windows/build/runtime/node/node.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-windows
          path: apps/windows/build/DeepSeek-Harness-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' || inputs.publish }}
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a dsh-v* tag for publishing
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Publishing to a GitHub Release requires running from a dsh-v* tag (current ref: $GITHUB_REF_NAME)."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: DeepSeek-Harness-*
          path: dist
          merge-multiple: true

      - name: Attach the apps to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh discovers the repository from git by default; this job has no
          # checkout, so name the repository explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#dsh-v}"
          if [[ -z "$(ls dist/DeepSeek-Harness-Setup-*.exe 2>/dev/null)" ]]; then
            echo "::error::no Windows setup asset found under dist/"
            exit 1
          fi
          NOTES=$(cat <<EOF
DeepSeek Harness ${VERSION} — Windows x64 自包含安装包（本 fork 构建）

## 特性
- Plan/Act 双模型分流：Plan 模式用 deepseek-v4-pro 思考，Act 模式用 deepseek-v4-flash 执行（Cline 风格）
- 模型选择器 Auto/Manual 开关：一键在「自动分流」与「手动选模型」之间切换
- 自包含：内置便携 Node.js 22 与 WebView2 运行时，无需预装 Node 或任何工具链

## 安装
1. 下载 DeepSeek-Harness-Setup-${VERSION}.exe
2. 双击按向导安装到 %ProgramFiles%\\DeepSeek Harness
3. 从开始菜单启动（可选桌面快捷方式）

## 卸载
设置 → 应用 → DeepSeek Harness → 卸载

## 说明
- 上游 npm 的 @deepseek-ai/dsh 不含以上 fork 特性（Plan/Act 分流、Auto/Manual 开关）
- 重新打包/更新方法见 apps/windows/README.md（rebundle.ps1 与安装版构建）
EOF
)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DeepSeek-Harness-Setup-*.exe --clobber
          else
            gh release create "$TAG" dist/DeepSeek-Harness-Setup-*.exe --title "DeepSeek Harness ${VERSION}" --notes "$NOTES"
          fi
          # A tag deleted and recreated (tag moves) leaves the release untagged
          # and draft with stale notes; (re)apply notes and publish so the asset
          # and description are both visible.
          gh release edit "$TAG" --notes "$NOTES" --draft=false >/dev/null 2>&1 || true
